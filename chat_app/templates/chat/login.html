<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MedAssist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ═══ AETHERIS DESIGN SYSTEM ═══ */
        :root {
            --primary: #4648d4;
            --secondary: #b4136d;
            --primary-container: #6063ee;
            --on-surface: #1b1b1c;
            --on-surface-variant: #464554;
            --outline: #767586;
            --outline-variant: #c7c4d7;
            --surface: #fcf9f8;
            --error: #ba1a1a;
            --error-container: #ffdad6;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }

        /* Mesh gradient background */
        body {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(at 40% 20%, hsla(228,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,1) 0px, transparent 50%);
            background-color: #f6f3f2;
            background-attachment: fixed;
            background-size: cover;
        }

        /* Glass card */
        .glass-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255,255,255,0.60);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(70,72,212,0.12), 0 8px 32px rgba(0,0,0,0.08);
            overflow: hidden;
            animation: cardIn .45s cubic-bezier(.22,1,.36,1);
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(20px) scale(.97); } to { opacity:1; transform:none; } }

        .card-header {
            padding: 36px 36px 28px;
            background: linear-gradient(135deg, rgba(70,72,212,0.06) 0%, rgba(180,19,109,0.04) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            text-align: center;
        }

        /* Iridescent brand orb */
        .brand-orb {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #4648d4, #b4136d, #06b6d4, #6063ee, #4648d4);
            margin: 0 auto 16px;
            position: relative;
            box-shadow: 0 0 30px rgba(70,72,212,0.4), 0 0 60px rgba(180,19,109,0.2);
            animation: orbSpin 8s linear infinite;
        }
        .brand-orb::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-orb-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 20px;
        }
        .brand-orb-inner {
            width: calc(100% - 12px);
            height: calc(100% - 12px);
            position: absolute;
            top: 6px; left: 6px;
            border-radius: 50%;
            background: white;
        }
        @keyframes orbSpin { to { transform: rotate(360deg); } }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #4648d4, #b4136d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .brand-sub {
            font-size: 13px;
            color: var(--on-surface-variant);
            font-weight: 500;
        }
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--on-surface);
            margin-top: 20px;
            letter-spacing: -0.02em;
        }
        .card-subtitle {
            font-size: 13px;
            color: var(--on-surface-variant);
            margin-top: 4px;
        }

        .card-body { padding: 28px 36px 36px; }

        /* Field */
        .field { margin-bottom: 16px; }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--on-surface-variant);
            margin-bottom: 7px;
        }
        .field-input {
            display: block;
            width: 100%;
            padding: 13px 18px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(199,196,215,0.6);
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            color: var(--on-surface);
            outline: none;
            transition: all .2s ease;
        }
        .field-input::placeholder { color: var(--outline); }
        .field-input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.92);
            box-shadow: 0 0 0 3px rgba(70,72,212,0.12);
        }

        /* Alert */
        .alert-error {
            background: var(--error-container);
            color: var(--error);
            border: 1px solid rgba(186,26,26,0.2);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Gradient button */
        .btn-gradient {
            display: block;
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #6063ee 0%, #b4136d 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 99px;
            cursor: pointer;
            transition: all .25s ease;
            box-shadow: 0 4px 20px rgba(70,72,212,0.35);
            letter-spacing: 0.01em;
            margin-top: 8px;
        }
        .btn-gradient:hover {
            box-shadow: 0 8px 30px rgba(70,72,212,0.45);
            transform: translateY(-1px);
        }
        .btn-gradient:active { transform: translateY(0); }

        /* Glass chip link */
        .glass-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 99px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            transition: all .2s ease;
        }
        .glass-chip:hover {
            background: rgba(255,255,255,0.92);
            box-shadow: 0 4px 16px rgba(70,72,212,0.15);
        }

        .footer-row {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-text { font-size: 13px; color: var(--on-surface-variant); }
        .divider {
            border: none;
            border-top: 1px solid rgba(199,196,215,0.5);
            margin: 22px 0;
        }
        .info-glass {
            background: rgba(70,72,212,0.05);
            border: 1px solid rgba(70,72,212,0.15);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 12.5px;
            color: var(--on-surface-variant);
            text-align: center;
            line-height: 1.5;
        }
        .info-glass a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
        .info-glass a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="card-header">
            <div class="brand-orb">
                <div class="brand-orb-inner"></div>
                <div class="brand-orb-icon">
                    <svg width="22" height="22" fill="none" stroke="#4648d4" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                </div>
            </div>
            <div class="brand-name">MedAssist AI</div>
            <div class="brand-sub">Clinical Knowledge Assistant</div>
            <div class="card-title">Welcome back</div>
            <div class="card-subtitle">Sign in to your clinical workspace</div>
        </div>

        <div class="card-body">
            {% if error %}
            <div class="alert-error">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" autocomplete="on">
                {% csrf_token %}
                <div class="field">
                    <label class="field-label" for="id_username">Username</label>
                    <input class="field-input" id="id_username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="field" style="margin-bottom:24px;">
                    <label class="field-label" for="id_password">Password</label>
                    <input class="field-input" id="id_password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button class="btn-gradient" type="submit">Sign In →</button>
            </form>

            <div class="footer-row">
                <span class="footer-text">No account?</span>
                <a href="{% url 'user_register' %}" class="glass-chip">Register here</a>
            </div>

            <hr class="divider">

            <div class="info-glass">
                Model Control Admin? <a href="/model-control/login/">Sign in here →</a>
            </div>
        </div>
    </div>
</body>
</html>
