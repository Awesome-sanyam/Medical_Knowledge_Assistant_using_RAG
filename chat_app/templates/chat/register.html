<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — MedAssist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4648d4;
            --secondary: #b4136d;
            --on-surface: #1b1b1c;
            --on-surface-variant: #464554;
            --outline: #767586;
            --outline-variant: #c7c4d7;
            --error: #ba1a1a;
            --error-container: #ffdad6;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
        body {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(at 40% 20%, hsla(228,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,1) 0px, transparent 50%);
            background-color: #f6f3f2;
            background-attachment: fixed;
        }
        .glass-card {
            width: 100%; max-width: 440px;
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255,255,255,0.60);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(70,72,212,0.12), 0 8px 32px rgba(0,0,0,0.08);
            overflow: hidden;
            animation: cardIn .45s cubic-bezier(.22,1,.36,1);
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(20px) scale(.97); } to { opacity:1; transform:none; } }
        .card-header {
            padding: 28px 36px 22px;
            background: linear-gradient(135deg, rgba(70,72,212,0.06) 0%, rgba(180,19,109,0.04) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            display: flex; align-items: center; gap: 14px;
        }
        .brand-orb-sm {
            width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            background: conic-gradient(from 0deg, #4648d4, #b4136d, #06b6d4, #6063ee, #4648d4);
            position: relative;
            box-shadow: 0 0 16px rgba(70,72,212,0.4);
            animation: orbSpin 8s linear infinite;
        }
        .brand-orb-sm::after { content:''; position:absolute; inset:4px; border-radius:50%; background:white; }
        @keyframes orbSpin { to { transform:rotate(360deg); } }
        .brand-name {
            font-size: 19px; font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(90deg, #4648d4, #b4136d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-tag { font-size: 12px; color: var(--on-surface-variant); font-weight: 500; }
        .card-body { padding: 26px 36px 32px; max-height: calc(100svh - 220px); overflow-y: auto; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--on-surface); margin-bottom: 4px; letter-spacing: -0.02em; }
        .page-sub { font-size: 13px; color: var(--on-surface-variant); margin-bottom: 24px; }
        .field { margin-bottom: 14px; }
        .field-label { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--on-surface-variant); margin-bottom:6px; }
        .field-input {
            display:block; width:100%; padding:12px 17px;
            background: rgba(255,255,255,0.75); backdrop-filter:blur(8px);
            border: 1px solid rgba(199,196,215,0.6);
            border-radius: 14px; font-size:14px; font-family:inherit;
            color:var(--on-surface); outline:none; transition:all .2s ease;
        }
        .field-input::placeholder { color:var(--outline); }
        .field-input:focus { border-color:var(--primary); background:rgba(255,255,255,0.92); box-shadow:0 0 0 3px rgba(70,72,212,0.12); }
        /* Password strength */
        .pw-bar { height: 3px; border-radius: 99px; background: var(--outline-variant); margin-top: 6px; overflow: hidden; }
        .pw-bar-fill { height: 100%; border-radius: 99px; width: 0%; transition: all .3s ease; background: linear-gradient(90deg, #ba1a1a, #e65100, #4648d4, #006c49); background-size: 400% 100%; }
        .pw-hint { font-size: 11px; margin-top: 4px; color: var(--outline); }
        .pw-match { font-size: 11px; margin-top: 4px; }
        .pw-match.ok { color: #006c49; } .pw-match.err { color: var(--error); }
        /* Error */
        .alert-error { background:var(--error-container); color:var(--error); border:1px solid rgba(186,26,26,.2); border-radius:14px; padding:12px 16px; font-size:13px; margin-bottom:18px; }
        .alert-error div { margin-bottom: 2px; }
        /* Buttons */
        .btn-gradient { display:block; width:100%; padding:14px 24px; background:linear-gradient(135deg,#6063ee 0%,#b4136d 100%); color:white; font-size:15px; font-weight:700; font-family:inherit; border:none; border-radius:99px; cursor:pointer; transition:all .25s ease; box-shadow:0 4px 20px rgba(70,72,212,.35); margin-top:8px; }
        .btn-gradient:hover { box-shadow:0 8px 30px rgba(70,72,212,.45); transform:translateY(-1px); }
        .footer-row { margin-top:18px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .footer-text { font-size:13px; color:var(--on-surface-variant); }
        .glass-chip { display:inline-flex; align-items:center; background:rgba(255,255,255,.7); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.6); border-radius:99px; padding:6px 16px; font-size:13px; font-weight:600; color:var(--primary); text-decoration:none; transition:all .2s ease; }
        .glass-chip:hover { background:rgba(255,255,255,.92); box-shadow:0 4px 16px rgba(70,72,212,.15); }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="card-header">
            <div class="brand-orb-sm"></div>
            <div>
                <div class="brand-name">MedAssist AI</div>
                <div class="brand-tag">Clinical Knowledge Assistant</div>
            </div>
        </div>
        <div class="card-body">
            <div class="page-title">Create account</div>
            <div class="page-sub">Join MedAssist and start your clinical consultations</div>

            {% if errors %}
            <div class="alert-error">
                {% for e in errors %}<div>• {{ e }}</div>{% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="field">
                    <label class="field-label" for="fn">Full Name</label>
                    <input class="field-input" id="fn" name="full_name" type="text" placeholder="Dr. Jane Smith" value="{{ full_name|default:'' }}">
                </div>
                <div class="field">
                    <label class="field-label" for="em">Email</label>
                    <input class="field-input" id="em" name="email" type="email" placeholder="jane@clinic.org" value="{{ email|default:'' }}">
                </div>
                <div class="field">
                    <label class="field-label" for="un">Username</label>
                    <input class="field-input" id="un" name="username" type="text" placeholder="Choose a username" value="{{ username|default:'' }}" required autocomplete="username">
                </div>
                <div class="field">
                    <label class="field-label" for="pw">Password</label>
                    <input class="field-input" id="pw" name="password" type="password" placeholder="Min. 8 characters" required oninput="calcPwStrength(this.value)">
                    <div class="pw-bar"><div class="pw-bar-fill" id="pw-strength"></div></div>
                    <div class="pw-hint" id="pw-hint-text">At least 8 characters</div>
                </div>
                <div class="field" style="margin-bottom:22px;">
                    <label class="field-label" for="cpw">Confirm Password</label>
                    <input class="field-input" id="cpw" name="confirm_password" type="password" placeholder="Re-enter password" required oninput="checkMatch()">
                    <div class="pw-match" id="pw-match"></div>
                </div>
                <button class="btn-gradient" type="submit">Create Account →</button>
            </form>

            <div class="footer-row">
                <span class="footer-text">Already have an account?</span>
                <a href="{% url 'user_login' %}" class="glass-chip">Sign in</a>
            </div>
        </div>
    </div>
    <script>
    function calcPwStrength(v) {
        const bar = document.getElementById('pw-strength');
        const hint = document.getElementById('pw-hint-text');
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const pct = [0, 30, 55, 78, 100][score];
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        bar.style.width = pct + '%';
        bar.style.backgroundPosition = (100 - pct) + '% 0';
        hint.textContent = labels[score] || 'At least 8 characters';
    }
    function checkMatch() {
        const pw = document.getElementById('pw').value;
        const cpw = document.getElementById('cpw').value;
        const el = document.getElementById('pw-match');
        if (!cpw) { el.textContent = ''; return; }
        el.className = 'pw-match ' + (pw === cpw ? 'ok' : 'err');
        el.textContent = pw === cpw ? '✓ Passwords match' : '✗ Passwords do not match';
    }
    </script>
</body>
</html>
