<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — MedAssist Model Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#4648d4;--secondary:#b4136d;--tertiary:#006c49;--error:#ba1a1a;--error-container:#ffdad6;--on-surface:#1b1b1c;--on-surface-variant:#464554;--outline:#767586;--outline-variant:#c7c4d7;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
        body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;
            background-image:radial-gradient(at 40% 20%,hsla(228,100%,74%,1) 0px,transparent 50%),radial-gradient(at 80% 0%,hsla(189,100%,56%,1) 0px,transparent 50%),radial-gradient(at 0% 50%,hsla(355,100%,93%,1) 0px,transparent 50%),radial-gradient(at 80% 50%,hsla(340,100%,76%,1) 0px,transparent 50%),radial-gradient(at 0% 100%,hsla(22,100%,77%,1) 0px,transparent 50%),radial-gradient(at 80% 100%,hsla(242,100%,70%,1) 0px,transparent 50%),radial-gradient(at 0% 0%,hsla(343,100%,76%,1) 0px,transparent 50%);
            background-color:#f6f3f2;background-attachment:fixed;}
        .card{width:100%;max-width:420px;background:rgba(255,255,255,.84);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.62);border-radius:28px;box-shadow:0 20px 60px rgba(70,72,212,.14),0 8px 32px rgba(0,0,0,.08);animation:cardIn .42s cubic-bezier(.22,1,.36,1);}
        @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
        .card-head{padding:36px 36px 28px;background:linear-gradient(135deg,rgba(70,72,212,.05) 0%,rgba(180,19,109,.04) 100%);border-bottom:1px solid rgba(255,255,255,.52);text-align:center;}
        .orb{width:76px;height:76px;border-radius:50%;margin:0 auto 20px;background:conic-gradient(from 0deg,#4648d4,#b4136d,#06b6d4,#6063ee,#4648d4);position:relative;box-shadow:0 0 36px rgba(70,72,212,.42),0 0 70px rgba(180,19,109,.2);animation:orbSpin 8s linear infinite;}
        .orb::after{content:'';position:absolute;inset:7px;border-radius:50%;background:white;}
        .orb-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;}
        @keyframes orbSpin{to{transform:rotate(360deg);}}
        .brand{font-size:22px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,#4648d4,#b4136d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px;}
        .brand-sub{font-size:12.5px;color:var(--on-surface-variant);line-height:1.5;}
        .card-body{padding:28px 36px 36px;}
        .field{margin-bottom:16px;}
        .field-label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-variant);margin-bottom:6px;}
        .field-input{display:block;width:100%;padding:13px 16px;background:rgba(255,255,255,.78);border:1px solid rgba(199,196,215,.65);border-radius:14px;font-size:15px;font-family:inherit;color:var(--on-surface);outline:none;transition:all .2s ease;}
        .field-input::placeholder{color:var(--outline);}
        .field-input:focus{border-color:var(--primary);background:rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(70,72,212,.11);}
        .alert-error{background:var(--error-container);color:var(--error);border:1px solid rgba(186,26,26,.2);border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
        .btn{display:block;width:100%;padding:14px 24px;background:linear-gradient(135deg,#6063ee 0%,#b4136d 100%);color:white;font-size:15px;font-weight:700;font-family:inherit;border:none;border-radius:99px;cursor:pointer;transition:all .25s;box-shadow:0 4px 20px rgba(70,72,212,.35);margin-top:4px;}
        .btn:hover{box-shadow:0 8px 30px rgba(70,72,212,.48);transform:translateY(-1px);}
        .links{display:flex;justify-content:space-between;margin-top:20px;}
        .link{font-size:12.5px;color:var(--primary);font-weight:600;text-decoration:none;}
        .link:hover{text-decoration:underline;}
        .link.muted{color:var(--outline);font-weight:500;}
    </style>
</head>
<body>
    <div class="card">
        <div class="card-head">
            <div class="orb">
                <div class="orb-icon">
                    <svg width="26" height="26" fill="none" stroke="#4648d4" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
            </div>
            <div class="brand">Model Control</div>
            <div class="brand-sub">MedAssist AI Administration<br>Sign in with staff credentials</div>
        </div>
        <div class="card-body">
            {% if error %}
            <div class="alert-error">
                <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
                {{ error }}
            </div>
            {% endif %}
            <form method="post" autocomplete="on">
                {% csrf_token %}
                <div class="field">
                    <label class="field-label" for="un">Username</label>
                    <input class="field-input" id="un" name="username" type="text" placeholder="Enter admin username" autocomplete="username" required autofocus>
                </div>
                <div class="field" style="margin-bottom:22px;">
                    <label class="field-label" for="pw">Password</label>
                    <input class="field-input" id="pw" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button class="btn" type="submit">Admin Sign In →</button>
            </form>
            <div class="links">
                <a href="/model-control/register/" class="link">Request access</a>
                <a href="/chat/login/" class="link muted">← Patient/Doctor Login</a>
            </div>
        </div>
    </div>
</body>
</html>
