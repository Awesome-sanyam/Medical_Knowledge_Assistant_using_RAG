<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — MedAssist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-bg: #fafafa; --c-surface: #ffffff; --c-surface-2: #f5f5f5;
            --c-outline: #e0e0e0; --c-outline-2: #bdbdbd;
            --c-on-bg: #212121; --c-on-surface: #212121;
            --c-on-surface-2: #616161; --c-on-surface-3: #9e9e9e;
            --c-primary: #212121; --c-on-primary: #ffffff;
            --c-error: #c62828; --c-error-bg: #ffebee;
            --c-success: #1b5e20; --c-success-bg: #e8f5e9;
            --radius-sm: 8px; --radius-xl: 20px;
            --shadow-2: 0 2px 6px rgba(0,0,0,.08),0 4px 20px rgba(0,0,0,.06);
            --shadow-3: 0 4px 16px rgba(0,0,0,.1),0 8px 32px rgba(0,0,0,.07);
            --transition: all .18s cubic-bezier(.4,0,.2,1);
        }
        [data-dark] {
            --c-bg: #121212; --c-surface: #1e1e1e; --c-surface-2: #2a2a2a;
            --c-outline: #333; --c-outline-2: #444;
            --c-on-bg: #eeeeee; --c-on-surface: #eeeeee;
            --c-on-surface-2: #aaaaaa; --c-on-surface-3: #666;
            --c-primary: #eeeeee; --c-on-primary: #121212;
            --c-error: #ef9a9a; --c-error-bg: #311b1b;
            --c-success: #a5d6a7; --c-success-bg: #1b2e1b;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
        body { background: var(--c-bg); color: var(--c-on-bg); min-height: 100svh; transition: var(--transition); }
        .auth-page { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 440px; background: var(--c-surface); border: 1px solid var(--c-outline); border-radius: var(--radius-xl); box-shadow: var(--shadow-3); overflow: hidden; animation: fadeUp .35s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .auth-head { padding: 32px 36px 24px; border-bottom: 1px solid var(--c-outline); background: var(--c-on-bg); }
        [data-dark] .auth-head { background: var(--c-surface-2); }
        .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .brand-mark { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--c-on-primary); display: flex; align-items: center; justify-content: center; }
        [data-dark] .brand-mark { background: var(--c-surface-2); border: 1px solid var(--c-outline); }
        .brand-mark svg { color: var(--c-on-bg); }
        [data-dark] .brand-mark svg { color: var(--c-on-surface); }
        .brand-name { font-size: 16px; font-weight: 800; color: var(--c-on-primary); letter-spacing: -.03em; }
        .brand-tag { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 1px; }
        [data-dark] .brand-name, [data-dark] .brand-tag { color: var(--c-on-surface-2); }
        [data-dark] .brand-name { color: var(--c-on-surface); }
        .auth-title { font-size: 22px; font-weight: 800; color: var(--c-on-primary); letter-spacing: -.04em; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: rgba(255,255,255,.45); }
        [data-dark] .auth-title { color: var(--c-on-surface); }
        [data-dark] .auth-sub { color: var(--c-on-surface-3); }
        .auth-body { padding: 28px 36px 32px; max-height: calc(100svh - 260px); overflow-y: auto; }
        .field { margin-bottom: 14px; }
        .field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c-on-surface-2); margin-bottom: 6px; }
        .field-input { display: block; width: 100%; padding: 11px 14px; background: var(--c-surface-2); border: 1px solid var(--c-outline); border-radius: var(--radius-sm); color: var(--c-on-surface); font-size: 14px; font-family: inherit; outline: none; transition: var(--transition); }
        .field-input:focus { border-color: var(--c-on-surface-3); box-shadow: 0 0 0 3px rgba(0,0,0,.08); }
        [data-dark] .field-input:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
        .field-input::placeholder { color: var(--c-on-surface-3); }
        .pw-hint { font-size: 11px; margin-top: 4px; display: none; }
        .pw-hint.ok { color: var(--c-success); } .pw-hint.err { color: var(--c-error); display: block; }
        .btn-filled { display: block; width: 100%; padding: 12px 20px; background: var(--c-primary); color: var(--c-on-primary); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: var(--transition); margin-top: 8px; }
        .btn-filled:hover { opacity: .88; }
        .alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 18px; }
        .alert-error { background: var(--c-error-bg); color: var(--c-error); border: 1px solid rgba(198,40,40,.2); }
        .auth-footer-text { margin-top: 20px; text-align: center; font-size: 13px; color: var(--c-on-surface-3); }
        .auth-footer-text a { color: var(--c-on-surface-2); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
        .theme-fab { position: fixed; top: 20px; right: 20px; z-index: 999; width: 38px; height: 38px; border-radius: 50%; background: var(--c-surface); border: 1px solid var(--c-outline); box-shadow: var(--shadow-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; transition: var(--transition); }
    </style>
</head>
<body>
    <button class="theme-fab" onclick="toggleDark()" id="tfab">🌙</button>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-head">
                <div class="auth-brand">
                    <div class="brand-mark">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    </div>
                    <div>
                        <div class="brand-name">MedAssist AI</div>
                        <div class="brand-tag">Clinical Knowledge Assistant</div>
                    </div>
                </div>
                <div class="auth-title">Create account</div>
                <div class="auth-sub">Join MedAssist and start your clinical consultations</div>
            </div>
            <div class="auth-body">
                {% if errors %}
                <div class="alert alert-error">
                    {% for e in errors %}<div>• {{ e }}</div>{% endfor %}
                </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label class="field-label" for="fn">Full Name</label>
                        <input class="field-input" id="fn" name="full_name" type="text" placeholder="Dr. Jane Smith" value="{{ full_name|default:'' }}">
                    </div>
                    <div class="field">
                        <label class="field-label" for="em">Email</label>
                        <input class="field-input" id="em" name="email" type="email" placeholder="jane@clinic.org" value="{{ email|default:'' }}">
                    </div>
                    <div class="field">
                        <label class="field-label" for="un">Username</label>
                        <input class="field-input" id="un" name="username" type="text" placeholder="Choose a username" value="{{ username|default:'' }}" required autocomplete="username">
                    </div>
                    <div class="field">
                        <label class="field-label" for="pw">Password</label>
                        <input class="field-input" id="pw" name="password" type="password" placeholder="Minimum 8 characters" required>
                    </div>
                    <div class="field" style="margin-bottom: 24px;">
                        <label class="field-label" for="cpw">Confirm Password</label>
                        <input class="field-input" id="cpw" name="confirm_password" type="password" placeholder="Re-enter password" required>
                        <div class="pw-hint" id="pw-hint"></div>
                    </div>
                    <button class="btn-filled" type="submit">Create Account</button>
                </form>
                <p class="auth-footer-text">Already have an account? <a href="{% url 'user_login' %}">Sign in</a></p>
            </div>
        </div>
    </div>
    <script>
    const root = document.documentElement, fab = document.getElementById('tfab');
    if (localStorage.getItem('ma-dark') === '1') { root.setAttribute('data-dark', ''); fab.textContent = '☀️'; }
    function toggleDark() {
        if (root.hasAttribute('data-dark')) { root.removeAttribute('data-dark'); localStorage.setItem('ma-dark', '0'); fab.textContent = '🌙'; }
        else { root.setAttribute('data-dark', ''); localStorage.setItem('ma-dark', '1'); fab.textContent = '☀️'; }
    }
    const pw = document.getElementById('pw'), cpw = document.getElementById('cpw'), hint = document.getElementById('pw-hint');
    cpw.addEventListener('input', () => {
        if (!cpw.value) { hint.style.display = 'none'; return; }
        hint.style.display = 'block';
        if (pw.value === cpw.value) { hint.className = 'pw-hint ok'; hint.textContent = '✓ Passwords match'; }
        else { hint.className = 'pw-hint err'; hint.textContent = '✗ Passwords do not match'; }
    });
    </script>
</body>
</html>
