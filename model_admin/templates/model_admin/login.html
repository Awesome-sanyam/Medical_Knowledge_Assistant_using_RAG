<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Control — Secure Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f4f6; --surface: #ffffff; --border: #e2e2e5;
            --text: #0f0f10; --text2: #5c5c6e; --text3: #9898a8;
            --accent: #6c47ff; --red: #dc2626; --red-bg: #fee2e2;
            --shadow-lg: 0 8px 32px rgba(0,0,0,.1);
        }
        [data-theme="dark"] {
            --bg: #0c0c0e; --surface: #161618; --border: #2a2a30;
            --text: #f2f2f5; --text2: #9898b0; --text3: #52526a;
            --accent: #7c5cff; --red: #f87171; --red-bg: #450a0a;
            --shadow-lg: 0 8px 32px rgba(0,0,0,.5);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100svh; display: flex; align-items: center; justify-content: center;
            transition: background .2s, color .2s; padding: 24px;
        }
        .theme-btn {
            position: fixed; top: 20px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 99; font-size: 16px;
        }
        .card {
            width: 100%; max-width: 380px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px;
            box-shadow: var(--shadow-lg);
            animation: fadeUp .4s ease-out;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .logo-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
            background: linear-gradient(135deg, #0f0f10, #2a2a35);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
        }
        .logo-icon svg { color: white; }
        .logo-title { font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
        .logo-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
        .error-box {
            background: var(--red-bg); border: 1px solid rgba(220,38,38,.25);
            border-radius: 10px; padding: 10px 14px; font-size: 13px;
            color: var(--red); margin-bottom: 18px; display: flex; align-items: center; gap: 7px;
        }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 7px; }
        .field input {
            width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,71,255,.12); }
        .field input::placeholder { color: var(--text3); }
        .btn {
            width: 100%; padding: 12px; border-radius: 10px; margin-top: 8px;
            background: linear-gradient(135deg, #0f0f10 0%, #2a2a35 100%);
            color: white; font-size: 14px; font-weight: 600; border: none;
            cursor: pointer; font-family: inherit; transition: all .2s;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        [data-theme="dark"] .btn { background: linear-gradient(135deg, #6c47ff, #5535e0); box-shadow: 0 4px 12px rgba(108,71,255,.3); }
        .btn:hover { opacity: .88; transform: translateY(-1px); }
        .footer { margin-top: 28px; text-align: center; }
        .security-note {
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; font-size: 11px; color: var(--text3); line-height: 1.5;
        }
        .back-link {
            display: inline-block; margin-top: 16px; font-size: 12px;
            color: var(--text3); text-decoration: none; transition: color .15s;
        }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()"><span id="ti">🌙</span></button>
    <div class="card">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <div>
                <div class="logo-title">Model Control</div>
                <div class="logo-sub">Administrator Access · MedAssist AI</div>
            </div>
        </div>

        {% if error %}
        <div class="error-box">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Admin username" autocomplete="username">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn" type="submit">Sign In to Model Control →</button>
        </form>

        <div class="footer">
            <div class="security-note">
                🔒 Accounts are created exclusively by the Django Administrator.<br>
                Unauthorized access attempts are logged.
            </div>
            <a href="/chat/" class="back-link">← Back to Chat Interface</a>
        </div>
    </div>
    <script>
    const root = document.documentElement, ti = document.getElementById('ti');
    const s = localStorage.getItem('ma-theme') || 'light';
    root.setAttribute('data-theme', s); ti.textContent = s === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
        const n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', n); localStorage.setItem('ma-theme', n);
        ti.textContent = n === 'dark' ? '☀️' : '🌙';
    }
    </script>
</body>
</html>
