<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Control Admin — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#ffffff;--bg2:#f9f9f9;--bg3:#f2f2f2;--bd:#e4e4e7;--tx:#111827;--tx2:#6b7280;--tx3:#9ca3af;--acc:#111827;}
        .dark{--bg:#0a0a0a;--bg2:#111111;--bg3:#1c1c1c;--bd:#272727;--tx:#f5f5f5;--tx2:#a1a1aa;--tx3:#52525b;--acc:#f5f5f5;}
        *{font-family:'Inter',sans-serif;box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;min-height:100vh;transition:background .25s,color .25s;position:relative;overflow:hidden;}
        .inp{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:13px 16px;font-size:14px;outline:none;transition:border .2s,box-shadow .2s;}
        .inp:focus{border-color:var(--tx3);box-shadow:0 0 0 3px rgba(0,0,0,0.05);}
        .dark .inp:focus{box-shadow:0 0 0 3px rgba(255,255,255,0.05);}
        .inp::placeholder{color:var(--tx3);}
        .btn{width:100%;background:var(--tx);color:var(--bg);border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;}
        .btn:hover{opacity:.88;}
        .btn:active{transform:scale(0.98);}
        .toggle{width:40px;height:22px;background:var(--bg3);border:1px solid var(--bd);border-radius:99px;position:relative;cursor:pointer;transition:all .25s;}
        .toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--tx);transition:transform .25s;}
        .dark .toggle::after{transform:translateX(18px);}
        label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:7px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .card-anim{animation:fadeUp .5s ease-out both;}

        /* Background grid pattern */
        .bg-grid{position:fixed;inset:0;z-index:0;
            background-image:linear-gradient(var(--bd) 1px, transparent 1px),linear-gradient(90deg, var(--bd) 1px, transparent 1px);
            background-size:60px 60px;opacity:0.25;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div style="position:fixed;top:20px;right:24px;z-index:100;display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:var(--tx3);" id="theme-lbl">Light</span>
        <div class="toggle" onclick="toggleTheme()"></div>
    </div>

    <div class="card-anim" style="position:relative;z-index:1;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 12px 48px rgba(0,0,0,0.08);">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
            <div style="width:44px;height:44px;background:var(--tx);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.1);">
                <svg width="20" height="20" fill="none" stroke="var(--bg)" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <div>
                <div style="font-size:20px;font-weight:900;letter-spacing:-.03em;">Model Control</div>
                <div style="font-size:12px;color:var(--tx3);">Administrator Access Only</div>
            </div>
        </div>

        {% if error %}
        <div style="background:var(--bg3);border:1px solid #f87171;border-radius:12px;padding:12px 16px;font-size:13px;color:#ef4444;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:18px;">
                <label for="username">Username</label>
                <input class="inp" id="username" name="username" type="text" placeholder="Admin username" autocomplete="username">
            </div>
            <div style="margin-bottom:28px;">
                <label for="password">Password</label>
                <input class="inp" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn" type="submit">Sign In to Model Control →</button>
        </form>

        <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--bd);text-align:center;">
            <p style="font-size:11px;color:var(--tx3);line-height:1.5;">
                🔒 Admin accounts are created by the Django administrator.<br>
                Access is restricted to authorized personnel only.
            </p>
            <a href="/chat/" style="font-size:12px;color:var(--tx2);text-decoration:none;display:inline-block;margin-top:12px;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;transition:all .15s;" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">← Back to Chat Interface</a>
        </div>
    </div>

    <script>
    const html = document.documentElement;
    const lbl = document.getElementById('theme-lbl');
    html.className = localStorage.getItem('theme') || 'light';
    lbl.textContent = html.className === 'dark' ? 'Dark' : 'Light';
    function toggleTheme() {
        const n = html.className === 'dark' ? 'light' : 'dark';
        html.className = n; localStorage.setItem('theme', n);
        lbl.textContent = n === 'dark' ? 'Dark' : 'Light';
    }
    </script>
</body>
</html>
