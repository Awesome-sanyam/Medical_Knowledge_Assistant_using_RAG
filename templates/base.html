<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedAssist AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
/* ═══════════════════════════════════════════════════
   MedAssist AI — Enterprise Design System v3
   Token palette: Clinical Teal (#0d9488) · Indigo (#6366f1)
   ═══════════════════════════════════════════════════ */
:root {
    --primary:       #0d9488;
    --primary-dark:  #0f766e;
    --primary-light: #ccfbf1;
    --primary-muted: rgba(13,148,136,.08);
    --accent:        #6366f1;
    --accent-muted:  rgba(99,102,241,.08);
    --surface:       #ffffff;
    --surface-2:     #f8fafc;
    --surface-3:     #f1f5f9;
    --on-surface:    #0f172a;
    --on-surface-2:  #334155;
    --on-surface-3:  #64748b;
    --outline:       #cbd5e1;
    --outline-light: #e2e8f0;
    --error:         #dc2626;
    --error-bg:      #fef2f2;
    --success:       #059669;
    --success-bg:    #ecfdf5;
    --warning:       #d97706;
    --warning-bg:    #fffbeb;
    --shadow-sm:     0 1px 2px rgba(0,0,0,.05);
    --shadow-md:     0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
    --shadow-lg:     0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
    --t:             all .2s cubic-bezier(.4,0,.2,1);
    --radius:        12px;
    --radius-lg:     16px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
body { background: var(--surface-3); color: var(--on-surface); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 99px; }
::-webkit-scrollbar-track { background: transparent; }
a { text-decoration: none; color: inherit; }

.card { background: var(--surface); border: 1px solid var(--outline-light); border-radius: var(--radius-lg); }
.btn-primary { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 11px 22px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: var(--t); box-shadow: 0 2px 8px rgba(13,148,136,.25); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.input-base { display: block; width: 100%; padding: 11px 14px; background: var(--surface); border: 1.5px solid var(--outline-light); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--on-surface); outline: none; transition: var(--t); }
.input-base:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.1); }
.input-base::placeholder { color: var(--on-surface-3); }

.badge-green  { background: var(--success-bg); color: var(--success); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.badge-red    { background: var(--error-bg); color: var(--error); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.badge-yellow { background: var(--warning-bg); color: var(--warning); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
.badge-blue   { background: var(--accent-muted); color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 700; }

/* Toast */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--on-surface); color: white; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.22,1,.36,1); white-space: nowrap; z-index: 9999; box-shadow: var(--shadow-lg); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

{% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <div id="toast"></div>
    {% block content %}{% endblock %}
    <script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    function getCsrf() {
        const m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
