<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Control — Admin Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--c-bg:#fafafa;--c-surface:#ffffff;--c-surface-2:#f5f5f5;--c-outline:#e0e0e0;--c-on-bg:#212121;--c-on-surface:#212121;--c-on-surface-2:#616161;--c-on-surface-3:#9e9e9e;--c-primary:#212121;--c-on-primary:#ffffff;--c-error:#c62828;--c-error-bg:#ffebee;--radius-sm:8px;--radius-xl:20px;--shadow-3:0 4px 16px rgba(0,0,0,.1),0 8px 32px rgba(0,0,0,.07);--t:all .18s cubic-bezier(.4,0,.2,1);}
        [data-dark]{--c-bg:#121212;--c-surface:#1e1e1e;--c-surface-2:#262626;--c-outline:#2e2e2e;--c-on-bg:#eeeeee;--c-on-surface:#eeeeee;--c-on-surface-2:#9e9e9e;--c-on-surface-3:#616161;--c-primary:#eeeeee;--c-on-primary:#121212;--c-error:#ef9a9a;--c-error-bg:#311b1b;}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html{font-family:'Inter',system-ui,sans-serif;font-size:14px;}
        body{background:var(--c-bg);color:var(--c-on-bg);min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;transition:var(--t);}
        .auth-card{width:100%;max-width:400px;background:var(--c-surface);border:1px solid var(--c-outline);border-radius:var(--radius-xl);box-shadow:var(--shadow-3);overflow:hidden;animation:fadeUp .35s ease-out;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .auth-head{padding:28px 32px 22px;border-bottom:1px solid var(--c-outline);background:var(--c-on-bg);}
        [data-dark] .auth-head{background:var(--c-surface-2);}
        .auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
        .brand-mark{width:36px;height:36px;border-radius:var(--radius-sm);background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
        [data-dark] .brand-mark{background:var(--c-surface-2);border:1px solid var(--c-outline);}
        .brand-mark svg{color:rgba(255,255,255,.9);}
        [data-dark] .brand-mark svg{color:var(--c-on-surface-2);}
        .brand-name{font-size:15px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:-.03em;}
        .brand-tag{font-size:11px;color:rgba(255,255,255,.4);margin-top:1px;}
        [data-dark] .brand-name{color:var(--c-on-surface);}
        [data-dark] .brand-tag{color:var(--c-on-surface-3);}
        .auth-title{font-size:20px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:-.04em;margin-bottom:3px;}
        .auth-sub{font-size:12.5px;color:rgba(255,255,255,.4);}
        [data-dark] .auth-title{color:var(--c-on-surface);}
        [data-dark] .auth-sub{color:var(--c-on-surface-3);}
        .auth-body{padding:26px 32px 30px;}
        .field{margin-bottom:15px;}
        .field-label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-on-surface-2);margin-bottom:6px;}
        .field-input{display:block;width:100%;padding:11px 14px;background:var(--c-surface-2);border:1px solid var(--c-outline);border-radius:var(--radius-sm);color:var(--c-on-surface);font-size:14px;font-family:inherit;outline:none;transition:var(--t);}
        .field-input:focus{border-color:var(--c-on-surface-3);box-shadow:0 0 0 3px rgba(0,0,0,.07);}
        [data-dark] .field-input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.07);}
        .field-input::placeholder{color:var(--c-on-surface-3);}
        .btn-filled{display:block;width:100%;padding:12px 20px;background:var(--c-primary);color:var(--c-on-primary);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:var(--t);margin-top:8px;}
        .btn-filled:hover{opacity:.85;}
        .alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:18px;display:flex;align-items:flex-start;gap:8px;}
        .alert-error{background:var(--c-error-bg);color:var(--c-error);border:1px solid rgba(198,40,40,.2);}
        .info-box{background:var(--c-surface-2);border:1px solid var(--c-outline);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--c-on-surface-3);line-height:1.5;margin-top:20px;text-align:center;}
        .info-box a{color:var(--c-on-surface-2);font-weight:600;}
        .theme-fab{position:fixed;top:20px;right:20px;z-index:999;width:38px;height:38px;border-radius:50%;background:var(--c-surface);border:1px solid var(--c-outline);box-shadow:0 2px 8px rgba(0,0,0,.09);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:var(--t);}
    </style>
</head>
<body>
    <button class="theme-fab" onclick="toggleDark()" id="tfab">🌙</button>
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-brand">
                <div class="brand-mark">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <div>
                    <div class="brand-name">Model Control</div>
                    <div class="brand-tag">MedAssist AI — Restricted Access</div>
                </div>
            </div>
            <div class="auth-title">Administrator Sign In</div>
            <div class="auth-sub">Accounts provisioned exclusively by Django Administrator</div>
        </div>
        <div class="auth-body">
            {% if error %}
            <div class="alert alert-error">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
                {{ error }}
            </div>
            {% endif %}
            <form method="post" autocomplete="on">
                {% csrf_token %}
                <div class="field">
                    <label class="field-label" for="un">Username</label>
                    <input class="field-input" id="un" name="username" type="text" placeholder="Admin username" autocomplete="username" required>
                </div>
                <div class="field" style="margin-bottom:22px;">
                    <label class="field-label" for="pw">Password</label>
                    <input class="field-input" id="pw" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button class="btn-filled" type="submit">Sign In to Model Control</button>
            </form>
            <div class="info-box">
                🔒 Unauthorized access attempts are logged and audited.<br>
                <a href="/chat/">← Back to Chat Interface</a>
            </div>
        </div>
    </div>
    <script>
    const root=document.documentElement,tfab=document.getElementById('tfab');
    if(localStorage.getItem('ma-dark')==='1'){root.setAttribute('data-dark','');tfab.textContent='☀️';}
    function toggleDark(){if(root.hasAttribute('data-dark')){root.removeAttribute('data-dark');localStorage.setItem('ma-dark','0');tfab.textContent='🌙';}else{root.setAttribute('data-dark','');localStorage.setItem('ma-dark','1');tfab.textContent='☀️';}}
    </script>
</body>
</html>
