<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MedAssist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════ DESIGN SYSTEM ═══════════════ */
        :root {
            --c-bg: #fafafa; --c-surface: #ffffff; --c-surface-2: #f5f5f5;
            --c-outline: #e0e0e0; --c-outline-2: #bdbdbd;
            --c-on-bg: #212121; --c-on-surface: #212121;
            --c-on-surface-2: #616161; --c-on-surface-3: #9e9e9e;
            --c-primary: #212121; --c-on-primary: #ffffff;
            --c-error: #c62828; --c-error-bg: #ffebee;
            --c-success: #1b5e20; --c-success-bg: #e8f5e9;
            --c-warning-bg: #fff8e1;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
            --shadow-1: 0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.1);
            --shadow-2: 0 2px 6px rgba(0,0,0,.08),0 4px 20px rgba(0,0,0,.06);
            --shadow-3: 0 4px 16px rgba(0,0,0,.1),0 8px 32px rgba(0,0,0,.07);
            --sidebar-w: 232px; --header-h: 52px;
            --transition: all .18s cubic-bezier(.4,0,.2,1);
        }
        [data-dark] {
            --c-bg: #121212; --c-surface: #1e1e1e; --c-surface-2: #2a2a2a;
            --c-outline: #333; --c-outline-2: #444;
            --c-on-bg: #eeeeee; --c-on-surface: #eeeeee;
            --c-on-surface-2: #aaaaaa; --c-on-surface-3: #666;
            --c-primary: #eeeeee; --c-on-primary: #121212;
            --c-error: #ef9a9a; --c-error-bg: #311b1b;
            --c-success: #a5d6a7; --c-success-bg: #1b2e1b;
            --c-warning-bg: #2e2b1b;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; -webkit-text-size-adjust: 100%; }
        body { background: var(--c-bg); color: var(--c-on-bg); min-height: 100svh; transition: var(--transition); }

        /* ═══════════════ AUTH LAYOUT ═══════════════ */
        .auth-page {
            min-height: 100svh; display: flex; align-items: center; justify-content: center;
            padding: 24px; background: var(--c-bg);
        }
        .auth-card {
            width: 100%; max-width: 440px; background: var(--c-surface);
            border: 1px solid var(--c-outline); border-radius: var(--radius-xl);
            box-shadow: var(--shadow-3); overflow: hidden;
        }
        .auth-head {
            padding: 32px 36px 24px; border-bottom: 1px solid var(--c-outline);
            background: var(--c-on-bg);
        }
        .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .brand-mark {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            background: var(--c-on-primary); display: flex; align-items: center; justify-content: center;
        }
        .brand-mark svg { color: var(--c-on-bg); }
        .brand-name { font-size: 16px; font-weight: 800; color: var(--c-on-primary); letter-spacing: -.03em; }
        .brand-tag { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
        [data-dark] .brand-mark { background: var(--c-surface-2); }
        [data-dark] .brand-mark svg { color: var(--c-on-surface); }
        [data-dark] .brand-name { color: var(--c-on-surface); }
        [data-dark] .auth-head { background: var(--c-surface-2); }
        .auth-title { font-size: 22px; font-weight: 800; color: var(--c-on-primary); letter-spacing: -.04em; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: rgba(255,255,255,.5); }
        [data-dark] .auth-title, [data-dark] .auth-sub { color: var(--c-on-surface-2); }
        [data-dark] .auth-title { color: var(--c-on-surface); }

        .auth-body { padding: 28px 36px 32px; }

        /* ═══════════════ FORM ELEMENTS ═══════════════ */
        .field { margin-bottom: 16px; }
        .field-label {
            display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em;
            text-transform: uppercase; color: var(--c-on-surface-2); margin-bottom: 7px;
        }
        .field-input {
            display: block; width: 100%; padding: 11px 14px;
            background: var(--c-surface-2); border: 1px solid var(--c-outline);
            border-radius: var(--radius-sm); color: var(--c-on-surface);
            font-size: 14px; font-family: inherit; outline: none;
            transition: var(--transition);
        }
        .field-input:focus { border-color: var(--c-on-surface-3); box-shadow: 0 0 0 3px rgba(0,0,0,.08); }
        [data-dark] .field-input:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.08); }
        .field-input::placeholder { color: var(--c-on-surface-3); }

        /* ═══════════════ BUTTONS ═══════════════ */
        .btn-filled {
            display: block; width: 100%; padding: 12px 20px; text-align: center;
            background: var(--c-primary); color: var(--c-on-primary);
            border: none; border-radius: var(--radius-sm); font-size: 14px;
            font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: .01em;
            transition: var(--transition); box-shadow: var(--shadow-1);
        }
        .btn-filled:hover { opacity: .88; box-shadow: var(--shadow-2); }
        .btn-filled:active { opacity: .75; transform: scale(.99); }

        /* ═══════════════ ALERTS ═══════════════ */
        .alert {
            padding: 11px 14px; border-radius: var(--radius-sm);
            font-size: 13px; margin-bottom: 18px; display: flex; align-items: flex-start; gap: 8px;
        }
        .alert-error { background: var(--c-error-bg); color: var(--c-error); border: 1px solid rgba(198,40,40,.2); }
        .alert svg { flex-shrink: 0; margin-top: 1px; }

        /* ═══════════════ MISC ═══════════════ */
        .auth-footer-text { margin-top: 22px; text-align: center; font-size: 13px; color: var(--c-on-surface-3); }
        .auth-footer-text a { color: var(--c-on-surface-2); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
        .divider { border: none; border-top: 1px solid var(--c-outline); margin: 22px 0; }
        .info-box {
            background: var(--c-surface-2); border: 1px solid var(--c-outline);
            border-radius: var(--radius-sm); padding: 12px 14px;
            font-size: 12px; color: var(--c-on-surface-3); line-height: 1.5; text-align: center;
        }
        .info-box a { color: var(--c-on-surface-2); font-weight: 600; text-decoration: none; }
        .info-box a:hover { text-decoration: underline; }

        /* Theme button */
        .theme-fab {
            position: fixed; top: 20px; right: 20px; z-index: 999;
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--c-surface); border: 1px solid var(--c-outline);
            box-shadow: var(--shadow-2); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; transition: var(--transition);
        }
        .theme-fab:hover { box-shadow: var(--shadow-3); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .auth-card { animation: fadeUp .35s ease-out; }
    </style>
</head>
<body>
    <button class="theme-fab" onclick="toggleDark()" id="tfab" title="Toggle dark mode">🌙</button>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-head">
                <div class="auth-brand">
                    <div class="brand-mark">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <div>
                        <div class="brand-name">MedAssist AI</div>
                        <div class="brand-tag">Clinical Knowledge Assistant</div>
                    </div>
                </div>
                <div class="auth-title">Welcome back</div>
                <div class="auth-sub">Sign in to access your medical consultations</div>
            </div>
            <div class="auth-body">
                {% if error %}
                <div class="alert alert-error">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" autocomplete="on">
                    {% csrf_token %}
                    <div class="field">
                        <label class="field-label" for="id_username">Username</label>
                        <input class="field-input" id="id_username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                    <div class="field" style="margin-bottom: 24px;">
                        <label class="field-label" for="id_password">Password</label>
                        <input class="field-input" id="id_password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <button class="btn-filled" type="submit">Sign In</button>
                </form>

                <p class="auth-footer-text">No account? <a href="{% url 'user_register' %}">Register here</a></p>
                <hr class="divider">
                <div class="info-box">
                    Model Control Admin? <a href="/model-control/login/">Sign in here →</a>
                </div>
            </div>
        </div>
    </div>

    <script>
    const root = document.documentElement;
    const fab = document.getElementById('tfab');
    const D = 'data-dark';
    const stored = localStorage.getItem('ma-dark');
    if (stored === '1') { root.setAttribute(D, ''); fab.textContent = '☀️'; }
    function toggleDark() {
        if (root.hasAttribute(D)) { root.removeAttribute(D); localStorage.setItem('ma-dark', '0'); fab.textContent = '🌙'; }
        else { root.setAttribute(D, ''); localStorage.setItem('ma-dark', '1'); fab.textContent = '☀️'; }
    }
    </script>
</body>
</html>
